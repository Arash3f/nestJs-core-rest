name: Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  NODE_VERSION: 20
  PNPM_VERSION: 10.33.0

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nest_rest_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SERVER_ADDRESS: localhost
      SERVER_PORT: 3000
      SWAGGER_DOCS_PATH: docs
      SWAGGER_PATH: api_docs
      JWT_SECRET: mySecasdasdasdasdasdasdasdasdretTsadasc
      JWT_ACCESS_EXPIRE: 10000
      JWT_REFRESH_EXPIRE: 10000
      DATABASE_CONNECTION_URL: postgres://postgres:postgres@localhost:5432/nest_rest_core
      DATABASE_NAME: nest_rest_core
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_PORT: 5433
      DATABASE_HOST: localhost
      SEED_ON_BOOT: true
      SUPER_USER_NAME: admin
      SUPER_USER_USERNAME: admin
      SUPER_USER_PASSWORD: admin
      MEMBER_USER_NAME: member
      MEMBER_USER_USERNAME: member
      MEMBER_USER_PASSWORD: member
      PASSWORD_HASH_MEMORY_COST: 65536
      PASSWORD_HASH_TIME_COST: 2
      PASSWORD_HASH_PARALLELISM: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm run test

      - name: Run tests with coverage
        run: pnpm run test:cov

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit.xml
            test-results/
          retention-days: 7

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-nestjs
          fail_ci_if_error: false
