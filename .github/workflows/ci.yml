name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  PNPM_VERSION: 10.33.0

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nest_rest_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write test env file
        run: cp .env.test.sample .env.test

      - name: Generate Prisma client
        run: pnpm run prisma:generate:test

      - name: Apply database migrations
        run: pnpm exec env-cmd -f ./.env.test pnpm exec prisma migrate deploy

      - name: Boot app for Swagger client generation
        run: |
          set -a
          source .env.test
          set +a
          pnpm run start:dev:docker > app.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf "http://${SERVER_ADDRESS}:${SERVER_PORT}/health" > /dev/null; then
              echo "App responded successfully"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time"
          cat app.log
          exit 1

      - name: Generate Swagger API client
        run: pnpm exec env-cmd -f ./.env.test npx ts-node scripts/generate-api.ts

      - name: Stop app
        if: always()
        run: |
          # `nest start --webpack --watch` forks several layers of child
          # processes (webpack, ts-checker workers, the compiled dist/main
          # app); the dist/main process is the one actually bound to
          # SERVER_PORT, so kill by port rather than by the top-level PID.
          fuser -k 3000/tcp 2>/dev/null || true

      - name: Run linting
        run: pnpm run lint

      - name: Run tests with coverage
        run: pnpm run test:cov

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-nestjs
          fail_ci_if_error: false
