version: '3'

services:
  postgres:
    image: postgres:latest
    container_name: nest-rest-core-dev-postgres
    ports:
      - 5435:5432
    env_file:
    - docker.env.dev
    volumes:
      - /data/postgres:/data/postgres
    networks:
      - nest-rest-core-dev

  app:
    build:
      context: ../../
      dockerfile: docker/develop/Dockerfile.dev
    container_name: nest-rest-core-dev-app
    command: bash -c "pnpm run start:dev:docker"
    ports:
      - '8085:3000'
    depends_on:
      - postgres
    env_file:
      - '.env.docker.dev'
    networks:
      - nest-rest-core-dev

networks:
  nest-rest-core-dev: 
    driver: bridge
     